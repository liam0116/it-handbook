server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
    error_page 404 /404.html;

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 7d;
    }
}
